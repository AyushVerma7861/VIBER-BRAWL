services:
  - type: web
    name: viber-brawl-online
    branch: preview/dungeon-duel
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
