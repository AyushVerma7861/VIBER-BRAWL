name = "viber-brawl"
compatibility_date = "2026-09-26"

# Two things the build insists on:
#   1. `main` must exist, or an assets binding is rejected outright
#      ("Cannot use assets with a binding in an assets-only Worker")
#   2. `main` must live OUTSIDE the assets directory
# .mjs removes any doubt that the file is an ES module.
main = "worker.mjs"

[assets]
directory = "public"
binding = "ASSETS"
# true = EVERY request goes through the Worker first, which then falls through
# to the assets. Simpler than a path list, and there is no route left to forget.
run_worker_first = true

[vars]
# public values - safe in the repo, they already ship inside the page
PRIVY_APP_ID = "cmvkwos1x007d0giaefmoqz2c"
CHOG_CONTRACTS = "0xc96d31F8626c6D03Fae5dCD3d61e3FB9F4a73763"
CHOG_STANDARD = "erc721"
SESSION_TTL = "600"

# Leaderboard storage. Created 2026-10-30 in APAC.
[[d1_databases]]
binding = "DB"
database_name = "chog-trials-lb"
database_id = "b5dcc6f9-b51d-4d2f-80d4-75034c83cb51"
