name: Dungeon Duel live network check

on:
  push:
    branches: [preview/dungeon-duel]
    paths: [.github/workflows/duel-network-check.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dungeon-duel-live-network-check
  cancel-in-progress: false

jobs:
  live-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        region: [Singapore, Frankfurt]
        suite: [matches, browser-reconnect]
        include:
          - region: Singapore
            origin: https://viber-brawl-online.onrender.com
          - region: Frankfurt
            origin: https://viber-brawl-online-eu.onrender.com
    name: ${{ matrix.region }} / ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci
      - name: Run live matches from the hosted runner
        if: matrix.suite == 'matches'
        run: npm run test:matches -- "${{ matrix.origin }}"
      - name: Run Chrome reconnect test using the deployed game
        if: matrix.suite == 'browser-reconnect'
        run: node multiplayer/browser-reconnect.mjs "${{ matrix.origin }}"
