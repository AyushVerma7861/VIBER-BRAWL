primary_region = "sin"

[build]
  dockerfile = "multiplayer/Dockerfile"
  ignorefile = "multiplayer/Dockerfile.dockerignore"

[http_service]
  internal_port = 8788
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
